<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>turtleweb demo</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 12px; }
  pre { background: #f4f4f4; padding: .5rem; max-height: 10rem; overflow: auto; white-space: pre-wrap; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } pre { background: #222; } }
</style>
</head>
<body>
<h1>turtleweb</h1>
<p><select id="prog"></select> <button id="run">▶ Executar</button> <button id="stop">■ Parar</button></p>
<div id="area"></div>
<pre id="out"></pre>
<script src="/turtleweb/turtleweb.js"></script>
<script>
const out = document.getElementById("out");
const tw = TurtleWeb.mount(document.getElementById("area"), {
  base: "/turtleweb",
  onoutput: (stream, text) => { out.textContent += text; },
});
async function run() {
  out.textContent = "";
  const r = await fetch("/run?prog=" + encodeURIComponent(document.getElementById("prog").value), {method: "POST"});
  tw.attach((await r.json()).sid);
}
document.getElementById("run").onclick = run;
document.getElementById("stop").onclick = () => fetch("/stop", {method: "POST"});
fetch("/programs").then(r => r.json()).then(names => {
  const sel = document.getElementById("prog");
  for (const n of names) sel.append(new Option(n, n));
  const want = new URLSearchParams(location.search).get("prog");
  if (want) { sel.value = want; run(); }
});
</script>
</body>
</html>
